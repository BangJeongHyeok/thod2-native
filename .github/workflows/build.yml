name: build

# Builds and tests every push and pull request. A v* tag also publishes the
# player download (tools/package.ps1) as a GitHub release, so that
# https://github.com/BangJeongHyeok/thod2-native/releases/latest/download/thod2-native.zip
# always points to the newest one.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset x86

      - name: Build
        run: cmake --build --preset x86-release

      - name: Test
        run: ctest --preset x86-release

      - name: Package
        shell: pwsh
        run: ./tools/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: thod2-native
          path: build/package/thod2-native.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" build/package/thod2-native.zip
          --title "thod2-native ${{ github.ref_name }}" --notes-file docs/release-notes.md
