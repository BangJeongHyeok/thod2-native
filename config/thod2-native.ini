; thod2-native settings. Copied next to thod2_core.dll by tools\deploy.ps1
; (only when the game folder does not already have one).

[core]
; debug | info | warn | error
log_level = info
; 1 = keep running when Hod2.exe is not a supported build (patches may crash)
allow_unknown_exe = 0

[display]
; 1 = answer the startup "Attention" device confirmation with Yes without showing it
skip_device_dialog = 1
