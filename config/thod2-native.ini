; thod2-native settings. Copied next to thod2_core.dll by tools\deploy.ps1
; (only when the game folder does not already have one).

[core]
; debug | info | warn | error
log_level = info
; 1 = keep running when Hod2.exe is not a supported build (patches may crash)
allow_unknown_exe = 0

[display]
; 1 = answer the startup "Attention" device confirmation with Yes without showing it
skip_device_dialog = 1

[timing]
; 1 = sleep instead of busy-waiting for the next frame (CPU ~100% -> ~25%)
frame_wait_sleep = 1
; ms before the frame deadline that stay a busy wait (accuracy)
frame_wait_margin_ms = 1.0

[debug]
; 1 = log DirectDraw calls (display mode, surfaces, flips) to thod2-native.log
trace_ddraw = 0
; 1 = sample the main thread every ~1 ms and log where CPU time goes
profile = 0
