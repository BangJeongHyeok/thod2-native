; thod2-native settings. Copied next to thod2_core.dll by tools\deploy.ps1
; (only when the game folder does not already have one).

[core]
; debug | info | warn | error
log_level = info
; 1 = keep running when Hod2.exe is not a supported build (patches may crash)
allow_unknown_exe = 0

[display]
; 1 = answer the startup "Attention" device confirmation with Yes without showing it
skip_device_dialog = 1
; 1 = widescreen (wider view, HUD at the screen edges). Also sets dgVoodoo2 ScalingMode.
widescreen = 0
; auto = primary monitor, or W:H such as 16:9 / 21:9
widescreen_aspect = auto
; 1 = with widescreen, fill the sides of full-screen 2D pictures with their mirrored edge
widescreen_mirror = 1
; 1 = high refresh rate: draw interpolated frames between the game's 60 Hz ticks
interpolate = 0
; with interpolate: frame limit, 0 = monitor refresh rate (vsync)
max_fps = 0

[dgvoodoo]
; 1 = write the recommended dgVoodoo2 settings into dgVoodoo.conf at every start
; (borderless full-screen window, 4:3 at the highest resolution, Alt+Enter).
; 0 = leave dgVoodoo.conf alone (set it up yourself)
preset = 1
; with preset: dgVoodoo2 anti-aliasing: appdriven (off), 2x, 4x, 8x
antialiasing = 4x
; with preset: dgVoodoo2 texture filtering, empty = unchanged (16 = smooth, anisotropic)
filtering =

[assets]
; 1 = use data\tex\<bank>\<texture id>.png (hex id, e.g. scr_common\10B1.png) or
;     data\tex\<texture id>.png instead of the game's texture
replace_textures = 1

[files]
; 1 = keep saves, d3dx.dat and exception.log in %APPDATA% / %LOCALAPPDATA% \thod2-native
;     (existing saves are copied from the game folder the first time)
redirect_user_files = 1

[timing]
; 1 = sleep instead of busy-waiting for the next frame (CPU ~100% -> ~25%)
frame_wait_sleep = 1
; ms before the frame deadline that stay a busy wait (accuracy)
frame_wait_margin_ms = 1.0

[input]
; 1 = map the mouse cursor to the game area dgVoodoo2 draws (0 = original: window pixels)
map_cursor = 1
