; Recommended dgVoodoo2 settings for The House of the Dead 2 (thod2-native).
; Applied on top of dgVoodoo2's default dgVoodoo.conf by:
;   python tools\dgvoodoo-setup.py preset <game folder>
;
; Result: borderless window covering the screen, the game's 4:3 image rendered
; at the highest resolution that fits (e.g. 1440x1080 on a 1080p monitor),
; Alt+Enter toggles windowed/fullscreen, the desktop resolution never changes.
; Tested with dgVoodoo2 v2.87.5 (docs/work/compat-survey.md, test C).

[General]
; Do not switch the monitor into the game's 640x480 mode.
FullScreenMode = false
; Keep the 4:3 aspect ratio, black bars at the sides.
ScalingMode = stretched_ar

[GeneralExt]
; Borderless window the size of the screen.
WindowedAttributes = borderless,fullscreensize

[DirectX]
; Render 3D at the largest resolution that fits the screen.
Resolution = max
; Ignore the game's request for exclusive fullscreen.
AppControlledScreenMode = false
; Alt+Enter toggles between the borderless window and fullscreen.
DisableAltEnterToToggleScreenMode = false
; Hide the dgVoodoo logo in the corner.
dgVoodooWatermark = false
